name: Build Solus APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle con caché
        uses: gradle/actions/setup-gradle@v4

      - name: Generar Gradle Wrapper
        run: gradle wrapper --gradle-version 9.7.1

      - name: Dar permisos al wrapper
        run: chmod +x ./gradlew

      - name: Compilar APK (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: solus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
